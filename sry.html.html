<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sorry Mounica</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: pop 1s ease;
        }

        h1 {
            font-size: 48px;
            margin: 0;
            color: #ff4d6d;
        }

        p {
            margin-top: 15px;
            font-size: 18px;
            color: #444;
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>I am sorry, Mounica 💕</h1>
        <p>Please forgive me.</p>
    </div>

</body>
</html>
